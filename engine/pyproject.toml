[project]
name = "djengine"
version = "0.1.0"
description = "OneForAll audio engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "yt-dlp",
  "ytmusicapi",
  "mutagen",
  "pillow",
  "psutil",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djengine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["online: hits real YouTube"]
addopts = "-m 'not online'"
