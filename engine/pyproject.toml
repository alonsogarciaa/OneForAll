[project]
name = "djengine"
version = "0.1.0"
description = "OneForAll audio engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "yt-dlp",
  "ytmusicapi",
  "mutagen",
  "pillow",
  "psutil",
  "librosa>=1.0.0",
  "numpy>=2.5.4",
  "scipy>=1.18.1",
  "pyloudnorm>=0.2.0",
  "soundfile>=0.14.0",
  "mido>=1.3.3",
]

[project.optional-dependencies]
nn = [
    "audio-separator>=0.48.0",
    "audioread>=3.1.0",
    "deeprhythm>=0.0.13",
    "demucs>=4.0.1",
    "onnxruntime>=1.31.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djengine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["online: hits real YouTube", "slow: real models, minutes", "bench: accuracy benchmarks"]
addopts = "-m 'not online and not slow and not bench'"
